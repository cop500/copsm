<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Espace stagiaire — COP CMC Souss-Massa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #f8fbff;
      -webkit-text-size-adjust: 100%;
      background: #041018;
    }
    .bg, .overlay {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
    }
    .bg {
      z-index: 0;
      background: #0b2744 url('/bg-entreprise.jpg') center / cover no-repeat;
    }
    .overlay {
      z-index: 1;
      background: rgba(7, 26, 46, 0.55);
    }
    .wrap {
      position: relative;
      z-index: 2;
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }
    .hero { text-align: center; margin-bottom: 14px; }
    .logo {
      display: inline-block;
      background: #fff;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .logo img { height: 56px; width: auto; display: block; }
    .kicker {
      display: block;
      letter-spacing: 0.2em;
      font-size: 13px;
      font-weight: 700;
      color: #00a3e0;
      margin-bottom: 6px;
    }
    h1 { font-size: 32px; line-height: 1.15; margin-bottom: 8px; }
    .lead {
      max-width: 640px;
      margin: 0 auto;
      font-size: 17px;
      line-height: 1.45;
      color: #dbeafe;
    }
    h2 {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7dd3fc;
      margin: 16px 4px 8px;
    }
    .row { overflow: hidden; }
    .card {
      float: left;
      width: 100%;
      margin-bottom: 12px;
      padding: 16px 12px 14px;
      text-align: center;
      background: rgba(10, 36, 62, 0.88);
      border: 2px solid rgba(0, 163, 224, 0.35);
      border-radius: 18px;
    }
    .qr {
      width: 168px;
      height: 168px;
      margin: 0 auto 10px;
      padding: 10px;
      background: #fff;
      border-radius: 14px;
    }
    .qr img { width: 100%; height: 100%; display: block; }
    .verbe {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #00a3e0;
      margin-bottom: 4px;
    }
    .card h3 { font-size: 22px; margin-bottom: 6px; }
    .card p { font-size: 15px; color: #d7e8f5; margin-bottom: 8px; min-height: 40px; }
    .url { display: block; font-size: 13px; color: #b8e7f8; word-break: break-all; margin-bottom: 10px; }
    .btn {
      display: block;
      width: 100%;
      min-height: 56px;
      line-height: 56px;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      color: #071628;
      background: #00a3e0;
      border-radius: 12px;
    }
    .btn:active { background: #33b7e8; }
    .btn-scan {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 12px 10px;
      line-height: 1.25;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #0f3d6c;
      background: #fde68a;
      border-radius: 12px;
    }
    .foot { clear: both; text-align: center; margin-top: 8px; color: #93c5d8; font-size: 13px; }
    @media (min-width: 720px) {
      .card { width: 48%; margin-right: 2%; }
      .card:nth-child(2n) { margin-right: 0; }
    }
    @media (min-width: 1100px) {
      h1 { font-size: 40px; }
      .card { width: 23.5%; margin-right: 2%; margin-bottom: 16px; }
      .card:nth-child(2n) { margin-right: 2%; }
      .card:nth-child(4n) { margin-right: 0; }
      .plus .card { width: 48%; }
      .plus .card:nth-child(2n) { margin-right: 0; }
      .qr { width: 150px; height: 150px; }
    }
    @media (min-width: 1280px) and (orientation: landscape) {
      .qr { width: 170px; height: 170px; }
      .btn { min-height: 64px; line-height: 64px; font-size: 20px; }
      .card h3 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="wrap">
    <header class="hero">
      <div class="logo"><img src="/cop-space-logo.jpg" alt="COP Space" /></div>
      <span class="kicker">ESPACE STAGIAIRE</span>
      <h1>Toutes tes portes, un scan.</h1>
      <p class="lead">Pas de compte. Scanne le QR avec ton téléphone. Pour CV Connect, scanne uniquement le QR (dépôt du CV depuis le téléphone).</p>
    </header>
    <h2>Les 4 essentielles</h2>
    <div class="row" id="essentielles"></div>
    <h2>Pour aller plus loin</h2>
    <div class="row plus" id="plus"></div>
    <p class="foot">COP Space · Centre d’Orientation Professionnelle · CMC Souss-Massa</p>
  </div>
  <script>
    var origin = window.location.origin || 'https://copsm.space';
    var portes = [
      { verbe: 'Je m’inscris', titre: 'Ateliers', resume: 'Réserver une place à un atelier d’orientation ou d’insertion.', path: '/inscription-ateliers/', ecran: '/inscription-ateliers/ecran/', essentielle: true },
      { verbe: 'Je dépose', titre: 'CV Connect', resume: 'Envoyer mon CV au COP, avec mon pôle et ma filière.', path: '/cv-connect/public/', ecran: '/cv-connect/public/', essentielle: true, qrOnly: true },
      { verbe: 'Je postule', titre: 'Candidatures', resume: 'Voir les offres partenaires et déposer ma candidature.', path: '/candidature/', ecran: '/candidature/ecran/', essentielle: true },
      { verbe: 'Je demande', titre: 'Assistance', resume: 'Écrire à un conseiller pour une aide concrète.', path: '/assistance-stagiaires/demande/', ecran: '/assistance-stagiaires/demande/ecran/', essentielle: true },
      { verbe: 'Je rayonne', titre: 'Ambassadeurs', resume: 'Déclarer une action réalisée pour le COP.', path: '/ambassadeurs/', ecran: '/ambassadeurs/', essentielle: false },
      { verbe: 'Je témoigne', titre: 'Enquête insertion', resume: 'Dire où j’en suis après la formation.', path: '/enquete-insertion/public/', ecran: '/enquete-insertion/public/ecran/', essentielle: false }
    ];
    function qrSrc(url) {
      return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=' + encodeURIComponent(url);
    }
    function cardHtml(p) {
      var phoneUrl = origin + p.path;
      var openUrl = origin + p.ecran;
      var shortUrl = phoneUrl.replace(/^https?:\/\//, '');
      var action = p.qrOnly
        ? '<span class="btn-scan">Merci de scanner le code QR</span>'
        : '<a class="btn" href="' + openUrl + '">Ouvrir</a>';
      return '<article class="card">' +
        '<div class="qr"><img alt="QR ' + p.titre + '" src="' + qrSrc(phoneUrl) + '" /></div>' +
        '<span class="verbe">' + p.verbe + '</span>' +
        '<h3>' + p.titre + '</h3>' +
        '<p>' + p.resume + '</p>' +
        '<span class="url">' + shortUrl + '</span>' +
        action +
        '</article>';
    }
    function fill(id, list) {
      var el = document.getElementById(id);
      var html = '';
      for (var i = 0; i < list.length; i++) html += cardHtml(list[i]);
      el.innerHTML = html;
    }
    var ess = [];
    var plus = [];
    for (var i = 0; i < portes.length; i++) {
      if (portes[i].essentielle) ess.push(portes[i]);
      else plus.push(portes[i]);
    }
    fill('essentielles', ess);
    fill('plus', plus);
  </script>
</body>
</html>
