<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>OFPPT Got Talent — Écran kiosque — COP CMC Souss-Massa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/bg-entreprise.jpg') center/cover no-repeat;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.82) 100%),
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(124, 58, 237, 0.22) 0%, transparent 55%);
    }
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 640px;
      text-align: center;
      padding: clamp(28px, 4vw, 48px) clamp(20px, 4vw, 40px);
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vw, 32px);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .logos img {
      height: clamp(72px, 10vw, 110px);
      width: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
    }
    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.28);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #e9d5ff;
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    h1 span { color: #fdba74; }
    .desc {
      font-size: clamp(16px, 2.2vw, 20px);
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 28px;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-start {
      width: 100%;
      max-width: 420px;
      min-height: 64px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(249, 115, 22, 0.4);
      margin: 0 auto;
      display: block;
    }
    .btn-start:active { transform: scale(0.98); }
    .qr-block {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .qr-block p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 12px;
    }
    .qr-block img {
      width: clamp(140px, 18vw, 180px);
      height: clamp(140px, 18vw, 180px);
      border-radius: 14px;
      background: #fff;
      padding: 10px;
    }
    .qr-url {
      margin-top: 10px;
      font-size: 13px;
      color: #fdba74;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>

    <div class="card">
      <div class="logos">
        <img src="/logo%20CMC-01.png" alt="Logo CMC" />
        <img src="/LOGO%20CMC%20COP-01.png" alt="Logo CMC COP" />
      </div>
      <span class="badge">Clubs parascolaires</span>
      <h1>OFPPT <span>GOT TALENTS</span></h1>
      <p class="desc">
        Inscrivez-vous aux activités parascolaires : sport, culture, environnement et innovation.
      </p>
      <button type="button" class="btn-start" id="btnStart">Commencer l'inscription</button>
      <div class="qr-block">
        <p>Ou scannez le QR code avec votre téléphone</p>
        <img id="qrImg" alt="QR code inscription Got Talent" width="160" height="160" />
        <div class="qr-url" id="qrUrl"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var origin = window.location.origin || 'https://copsm.space';
      var FORM_URL = origin + '/got-talent/?kiosk=1';
      var qrImg = document.getElementById('qrImg');
      var qrUrl = document.getElementById('qrUrl');

      qrImg.src =
        'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' +
        encodeURIComponent(origin + '/got-talent/');
      qrUrl.textContent = origin + '/got-talent/';

      function openForm() {
        window.location.href = FORM_URL;
      }

      document.getElementById('btnStart').addEventListener('click', openForm);

      /* Kiosque : ouvrir directement le formulaire plein écran */
      if (window.location.search.indexOf('auto=1') !== -1) {
        openForm();
      }
    })();
  </script>
</body>
</html>
